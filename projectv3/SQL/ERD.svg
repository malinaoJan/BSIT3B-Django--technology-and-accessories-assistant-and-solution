<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1060" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="crow1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L0,12 M0,6 L10,6" stroke="#333" stroke-width="1.6" fill="none"/>
    </marker>
    <marker id="crowN" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto">
      <path d="M12,1 C6,4 6,10 12,13 M12,1 L2,7 L12,13" stroke="#333" stroke-width="1.6" fill="none"/>
    </marker>
    <style>
      .tbl { fill: #ffffff; stroke: #1a73e8; stroke-width: 2; rx: 8; }
      .hdr { fill: #1a73e8; }
      .hdrtext { fill: #ffffff; font-size: 15px; font-weight: bold; }
      .pk { fill: #1a73e8; font-weight: bold; font-size: 13px; }
      .fk { fill: #188038; font-style: italic; font-size: 13px; }
      .col { fill: #202124; font-size: 13px; }
      .rel { stroke: #333; stroke-width: 1.8; fill: none; }
      .rellabel { fill: #fff; stroke: #5f6368; font-size: 12px; }
      .rellabeltext { fill: #202124; font-size: 12px; font-weight: bold; }
      .title { font-size: 24px; font-weight: bold; fill: #202124; }
      .subtitle { font-size: 13px; fill: #5f6368; }
    </style>
  </defs>

  <rect x="0" y="0" width="1520" height="1060" fill="#f8f9fa"/>
  <text x="30" y="38" class="title">TECHFIX System — Entity Relationship Diagram</text>
  <text x="30" y="58" class="subtitle">projectv3 (apps.core + apps.info + auth)  •  PK = primary key (blue bold)  •  FK = foreign key (green italic)  •  Lines: 1 ──∞  (one-to-many, crow's foot)</text>

  <!-- ============ auth_user (30,80) ============ -->
  <g>
    <rect x="30" y="80" width="300" height="318" rx="8" class="tbl"/>
    <rect x="30" y="80" width="300" height="32" rx="8" class="hdr"/>
    <rect x="30" y="100" width="300" height="12" fill="#1a73e8"/>
    <text x="40" y="102" class="hdrtext">auth_user  (Django user)</text>
    <text x="40" y="132" class="pk">id INT PK, AI</text>
    <text x="40" y="152" class="col">username VARCHAR(150) UNIQUE</text>
    <text x="40" y="172" class="col">password VARCHAR(128)</text>
    <text x="40" y="192" class="col">first_name / last_name VARCHAR(150)</text>
    <text x="40" y="212" class="col">email VARCHAR(254)</text>
    <text x="40" y="232" class="col">is_superuser / is_staff / is_active</text>
    <text x="40" y="252" class="col">last_login DATETIME NULL</text>
    <text x="40" y="272" class="col">date_joined DATETIME</text>
    <text x="40" y="296" class="subtitle">1 user owns N tblinfo rows</text>
    <text x="40" y="314" class="subtitle">is_superuser sees all; others own only</text>
    <text x="40" y="332" class="subtitle">their user_id rows (scoping.py)</text>
    <circle id="u_info" cx="180" cy="398" r="1" fill="none"/>
  </g>

  <!-- ============ tblinfo (30,420) ============ -->
  <g>
    <rect x="30" y="420" width="300" height="268" rx="8" class="tbl"/>
    <rect x="30" y="420" width="300" height="32" rx="8" class="hdr"/>
    <rect x="30" y="440" width="300" height="12" fill="#1a73e8"/>
    <text x="40" y="442" class="hdrtext">tblinfo  (Info)</text>
    <text x="40" y="472" class="pk">id BIGINT PK, AI</text>
    <text x="40" y="492" class="col">name VARCHAR(255)</text>
    <text x="40" y="512" class="col">age INT (1..150)</text>
    <text x="40" y="532" class="col">address VARCHAR(255)</text>
    <text x="40" y="552" class="col">email VARCHAR(255)</text>
    <text x="40" y="572" class="fk">user_id INT FK NULL → auth_user.id</text>
    <text x="40" y="592" class="col">created_at / updated_at DATETIME</text>
    <text x="40" y="616" class="subtitle">FK: ON DELETE CASCADE</text>
    <text x="40" y="634" class="subtitle">IDX(tblinfo.user_id)</text>
  </g>

  <!-- ============ category (390,80) ============ -->
  <g>
    <rect x="390" y="80" width="310" height="188" rx="8" class="tbl"/>
    <rect x="390" y="80" width="310" height="32" rx="8" class="hdr"/>
    <rect x="390" y="100" width="310" height="12" fill="#1a73e8"/>
    <text x="400" y="102" class="hdrtext">techfix_category</text>
    <text x="400" y="132" class="pk">id BIGINT PK, AI</text>
    <text x="400" y="152" class="col">name VARCHAR(100) UNIQUE</text>
    <text x="400" y="172" class="col">description TEXT</text>
    <text x="400" y="192" class="col">created_at DATETIME</text>
    <text x="400" y="216" class="subtitle">ex. Laptops, Audio, Chargers</text>
    <text x="400" y="234" class="subtitle">1 category → N products/accessories/</text>
    <text x="400" y="250" class="subtitle">solutions</text>
  </g>

  <!-- ============ product (390,300) ============ -->
  <g>
    <rect x="390" y="300" width="310" height="348" rx="8" class="tbl"/>
    <rect x="390" y="300" width="310" height="32" rx="8" class="hdr"/>
    <rect x="390" y="320" width="310" height="12" fill="#1a73e8"/>
    <text x="400" y="322" class="hdrtext">techfix_product</text>
    <text x="400" y="352" class="pk">id BIGINT PK, AI</text>
    <text x="400" y="372" class="col">name VARCHAR(255)</text>
    <text x="400" y="392" class="fk">category_id BIGINT FK NULL → category.id</text>
    <text x="400" y="412" class="col">brand VARCHAR(100)</text>
    <text x="400" y="432" class="col">description TEXT</text>
    <text x="400" y="452" class="col">specifications TEXT (RAM/CPU/...)</text>
    <text x="400" y="472" class="col">price DECIMAL(10,2)</text>
    <text x="400" y="492" class="col">stock_quantity INT UNSIGNED</text>
    <text x="400" y="512" class="col">image VARCHAR(100) NULL</text>
    <text x="400" y="532" class="col">created_at / updated_at DATETIME</text>
    <text x="400" y="556" class="subtitle">FK: ON DELETE SET NULL</text>
    <text x="400" y="574" class="subtitle">IDX(product.category_id)</text>
    <text x="400" y="596" class="subtitle">laptop / phone / printer / router</text>
  </g>

  <!-- ============ accessory (750,300) ============ -->
  <g>
    <rect x="750" y="300" width="330" height="348" rx="8" class="tbl"/>
    <rect x="750" y="300" width="330" height="32" rx="8" class="hdr"/>
    <rect x="750" y="320" width="330" height="12" fill="#1a73e8"/>
    <text x="760" y="322" class="hdrtext">techfix_accessory</text>
    <text x="760" y="352" class="pk">id BIGINT PK, AI</text>
    <text x="760" y="372" class="col">name VARCHAR(255)</text>
    <text x="760" y="392" class="fk">category_id BIGINT FK NULL → category.id</text>
    <text x="760" y="412" class="col">brand VARCHAR(100)</text>
    <text x="760" y="432" class="col">description TEXT</text>
    <text x="760" y="452" class="col">price DECIMAL(10,2)</text>
    <text x="760" y="472" class="col">compatibility_notes TEXT</text>
    <text x="760" y="492" class="col">stock_quantity INT UNSIGNED</text>
    <text x="760" y="512" class="col">image VARCHAR(100) NULL</text>
    <text x="760" y="532" class="col">created_at DATETIME</text>
    <text x="760" y="556" class="subtitle">FK: ON DELETE SET NULL</text>
    <text x="760" y="574" class="subtitle">IDX(accessory.category_id)</text>
    <text x="760" y="596" class="subtitle">cases / chargers / keyboards / earbuds</text>
  </g>

  <!-- ============ solution (1130,300) ============ -->
  <g>
    <rect x="1130" y="300" width="360" height="368" rx="8" class="tbl"/>
    <rect x="1130" y="300" width="360" height="32" rx="8" class="hdr"/>
    <rect x="1130" y="320" width="360" height="12" fill="#1a73e8"/>
    <text x="1140" y="322" class="hdrtext">techfix_solution</text>
    <text x="1140" y="352" class="pk">id BIGINT PK, AI</text>
    <text x="1140" y="372" class="col">title VARCHAR(255)</text>
    <text x="1140" y="392" class="col">problem_description TEXT</text>
    <text x="1140" y="412" class="col">steps TEXT (Step 1, 2, ...)</text>
    <text x="1140" y="432" class="col">difficulty_level: Easy/Medium/Hard</text>
    <text x="1140" y="452" class="fk">category_id BIGINT FK NULL → category.id</text>
    <text x="1140" y="472" class="fk">related_product_id BIGINT FK NULL</text>
    <text x="1140" y="490" class="fk">→ product.id</text>
    <text x="1140" y="510" class="col">video_url VARCHAR(200)</text>
    <text x="1140" y="530" class="col">created_at / updated_at DATETIME</text>
    <text x="1140" y="554" class="subtitle">FKs: ON DELETE SET NULL</text>
    <text x="1140" y="572" class="subtitle">IDX(category_id, related_product_id)</text>
    <text x="1140" y="596" class="subtitle">step-by-step fix for common issue</text>
  </g>

  <!-- ============ junction (750,700) ============ -->
  <g>
    <rect x="750" y="700" width="330" height="170" rx="8" class="tbl" stroke-dasharray="7 4"/>
    <rect x="750" y="700" width="330" height="32" rx="8" class="hdr"/>
    <rect x="750" y="720" width="330" height="12" fill="#1a73e8"/>
    <text x="760" y="722" class="hdrtext">accessory_compatible_products</text>
    <text x="760" y="752" class="pk">id BIGINT PK, AI</text>
    <text x="760" y="772" class="fk">accessory_id BIGINT FK → accessory.id</text>
    <text x="760" y="792" class="fk">product_id BIGINT FK → product.id</text>
    <text x="760" y="812" class="subtitle">UNIQUE(accessory_id, product_id)</text>
    <text x="760" y="830" class="subtitle">M:N junction • both CASCADE</text>
  </g>

  <!-- notes box -->
  <g>
    <rect x="30" y="720" width="300" height="150" rx="8" fill="#fff8e1" stroke="#f9ab00" stroke-width="1.6"/>
    <text x="40" y="744" font-size="13" font-weight="bold" fill="#202124">Cardinality legend</text>
    <text x="40" y="766" font-size="12" fill="#202124">──●  one side (1)</text>
    <text x="40" y="786" font-size="12" fill="#202124">──� crow's foot (many, N / ∞)</text>
    <text x="40" y="806" font-size="12" fill="#202124">SET NULL: keep child, null the FK</text>
    <text x="40" y="826" font-size="12" fill="#202124">CASCADE: delete children with parent</text>
    <text x="40" y="848" font-size="12" fill="#202124">Dashed table = M:N junction table</text>
  </g>

  <!-- ============ RELATIONSHIP LINES ============ -->
  <!-- user -> info (1:N) vertical -->
  <line x1="180" y1="398" x2="180" y2="420" class="rel"/>
  <rect x="140" y="400" width="80" height="18" rx="9" class="rellabel"/>
  <text x="150" y="413" class="rellabeltext">1 : N</text>

  <!-- category -> product -->
  <line x1="500" y1="268" x2="500" y2="300" class="rel"/>
  <rect x="460" y="272" width="80" height="18" rx="9" class="rellabel"/>
  <text x="470" y="285" class="rellabeltext">1 : N</text>

  <!-- category -> accessory (diagonal) -->
  <line x1="700" y1="220" x2="790" y2="300" class="rel"/>
  <rect x="712" y="246" width="80" height="18" rx="9" class="rellabel"/>
  <text x="722" y="259" class="rellabeltext">1 : N</text>

  <!-- category -> solution (long diagonal) -->
  <line x1="700" y1="180" x2="1130" y2="320" class="rel" stroke-dasharray="0"/>
  <rect x="880" y="228" width="80" height="18" rx="9" class="rellabel"/>
  <text x="890" y="241" class="rellabeltext">1 : N</text>

  <!-- product -> solution -->
  <line x1="700" y1="480" x2="1130" y2="480" class="rel"/>
  <rect x="890" y="470" width="80" height="18" rx="9" class="rellabel"/>
  <text x="900" y="483" class="rellabeltext">1 : N</text>

  <!-- product -> junction -->
  <line x1="600" y1="648" x2="830" y2="700" class="rel"/>
  <rect x="690" y="660" width="90" height="18" rx="9" class="rellabel"/>
  <text x="698" y="673" class="rellabeltext">1 : N (M)</text>

  <!-- accessory -> junction -->
  <line x1="915" y1="648" x2="915" y2="700" class="rel"/>
  <rect x="875" y="662" width="90" height="18" rx="9" class="rellabel"/>
  <text x="883" y="675" class="rellabeltext">1 : N (M)</text>

  <text x="30" y="920" class="subtitle">Source of truth: apps/core/models.py (Category, Product, Accessory+compatible_products M2M, Solution) + apps/info/models.py (Info.tblinfo) + Django auth_user.</text>
  <text x="30" y="940" class="subtitle">DDL: SQL/techfix_database.sql (MySQL) and SQL/techfix_database_sqlite.sql (SQLite). Editable diagrams: SQL/ERD.mmd (Mermaid) and SQL/ERD.puml (PlantUML).</text>
  <text x="30" y="960" class="subtitle">Junction table techfix_accessory_compatible_products is auto-created by Django for Accessory.compatible_products = ManyToManyField(Product).</text>
  <text x="30" y="1000" class="subtitle">Generated 2026-10-16 • TECHFIX projectv3</text>
</svg>
