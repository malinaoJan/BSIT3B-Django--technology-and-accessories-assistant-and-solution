{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sign in - TechFix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230d0d0d'/><path d='M50 24l6.5 19.5L76 50l-19.5 6.5L50 76l-6.5-19.5L24 50l19.5-6.5z' fill='white'/></svg>"/>
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/chatgpt-theme.css' %}?v=1" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="auth-body">
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-logo"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
        <span>TechFix</span>
      </div>

      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-sub">Sign in to continue to your Technology and Accessories Assistant.</p>

      {% if messages %}
      {% for message in messages %}
      <div id="error-message" class="alert alert-danger" role="alert">{{ message }}</div>
      {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">

        <div class="mb-3">
          <label class="form-label" for="loginUsername">Username</label>
          <input type="text" class="form-control" id="loginUsername" name="username"
                 autocomplete="username" required value="{{ username|default:'' }}" {% if locked %}disabled{% endif %}>
        </div>

        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-field">
            <input type="password" class="form-control" name="password" id="loginPassword"
                   autocomplete="current-password" required {% if locked %}disabled{% endif %}>
            <button class="password-toggle" type="button" id="toggleLoginPassword"
                    aria-label="Show password" {% if locked %}disabled{% endif %}>
              <i class="fa-regular fa-eye" id="loginEyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 auth-submit" {% if locked %}disabled{% endif %}>
          Sign in
        </button>
      </form>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="{% url 'register' %}">Create account</a>
    </p>
  </div>

  <script>
    (function () {
      var toggle = document.getElementById('toggleLoginPassword');
      if (toggle) {
        toggle.addEventListener('click', function () {
          var input = document.getElementById('loginPassword');
          var icon = document.getElementById('loginEyeIcon');
          if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
            toggle.setAttribute('aria-label', 'Hide password');
          } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
            toggle.setAttribute('aria-label', 'Show password');
          }
        });
      }
    })();
  </script>
  {% if locked %}
  <script>
    (function () {
      var remaining = {{ remaining }};
      var messageBox = document.getElementById('error-message');
      var interval = setInterval(function () {
        remaining--;
        if (messageBox) {
          if (remaining > 0) {
            messageBox.textContent = 'Too many failed attempts. Try again in ' + remaining + ' seconds.';
          } else {
            messageBox.textContent = 'You can try again now.';
          }
        }
        if (remaining <= 0) {
          clearInterval(interval);
          window.location.href = "{% url 'login' %}";
        }
      }, 1000);
    })();
  </script>
  {% endif %}
</body>
</html>
